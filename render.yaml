# Render Blueprint for a TEST/DEMO deployment only.
# The backend currently persists to JSON on local disk; a free/ephemeral instance
# resets modifications on redeploy/restart. Do not upload real student data.
services:
  - type: web
    name: lighthouse-uc11-test
    branch: staging
    autoDeploy: false # Enable only after CI gating is configured and verified.
    healthCheckPath: /api/health
    runtime: node
    rootDir: backend
    buildCommand: node --check server.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_ONLY
        value: '1'

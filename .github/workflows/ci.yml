name: LIGHTHOUSE checks
on:
  push:
    branches: [main, staging, 'codex/**']
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: API and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: API integration tests
        working-directory: backend
        env:
          LIGHTHOUSE_UPLOADS_DIR: ${{ runner.temp }}/lighthouse-test-uploads
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Browser smoke at 1920 and 1366
        run: |
          python scripts/browser_smoke.py
          python scripts/auth_browser_smoke.py
          python scripts/registration_browser_smoke.py
          python scripts/records_browser_smoke.py
          python scripts/figma_data_browser_smoke.py
          python scripts/management_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
          if-no-files-found: ignore
